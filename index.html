<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligenter AI Assistent</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #151932;
            --bg-tertiary: #1e2347;
            --accent-primary: #00d4ff;
            --accent-secondary: #7c3aed;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --success: #10b981;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(124,58,237,0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(0,212,255,0.15) 0%, transparent 50%);
            animation: drift 20s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0,0); }
            50% { transform: translate(50px,50px); }
        }

        .container {
            background: rgba(21,25,50,0.7);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            width: 100%;
            max-width: 900px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        .header {
            padding: 24px 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: linear-gradient(135deg, rgba(124,58,237,0.1) 0%, rgba(0,212,255,0.1) 100%);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-indicator {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.3);
            border-radius: 20px;
            font-size: 12px;
            color: var(--success);
        }

        .status-dot {
            width: 8px; height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px currentColor; }
            50% { opacity: 0.5; }
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.4s cubic-bezier(0.16,1,0.3,1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { flex-direction: row-reverse; }

        .avatar {
            width: 40px; height: 40px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .message.user .avatar { background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); }
        .message.assistant .avatar { background: var(--bg-tertiary); border: 1px solid rgba(255,255,255,0.1); }

        .message-content {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: var(--bg-tertiary);
            border: 1px solid rgba(255,255,255,0.1);
            border-bottom-left-radius: 4px;
        }

        .typing-indicator { display: flex; gap: 6px; padding: 14px 18px; }
        .typing-dot {
            width: 8px; height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        .welcome-message {
            text-align: center;
            padding: 60px 20px;
        }

        .welcome-message h2 {
            font-size: 26px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-message p { color: var(--text-secondary); line-height: 1.6; }

        .input-container {
            padding: 20px 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
            background: rgba(30,35,71,0.5);
        }

        .input-wrapper { display: flex; gap: 12px; align-items: flex-end; }

        #userInput {
            flex: 1;
            padding: 14px 20px;
            background: var(--bg-tertiary);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            resize: none;
            min-height: 52px;
            max-height: 120px;
        }

        #userInput:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
        }

        #sendBtn {
            padding: 0 28px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            height: 52px;
        }

        #sendBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,212,255,0.3);
        }

        #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Intelligenter AI Assistent</h1>
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span>Groq AI aktiv 🚀</span>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="welcome-message">
                <h2>Bereit! 🎉</h2>
                <p>Stelle mir beliebige Fragen – ich antworte mit echter AI.</p>
                <p style="font-size:13px;margin-top:12px;color:#64748b;">💡 z.B. „Erkläre Quantenphysik", „Schreib ein Gedicht über KI", „Was ist der Sinn des Lebens?"</p>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="Stelle mir eine Frage..." rows="1"></textarea>
                <button id="sendBtn">Senden →</button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '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';
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        let conversationHistory = [];

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        function clearWelcome() {
            const w = document.querySelector('.welcome-message');
            if (w) w.remove();
        }

        function addMessage(content, type) {
            clearWelcome();
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = `
                <div class="avatar">${type === 'user' ? '👤' : '🤖'}</div>
                <div class="message-content">${content.replace(/\n/g, '<br>')}</div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTyping() {
            clearWelcome();
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'typing';
            div.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="message-content typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typing');
            if (el) el.remove();
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;
            conversationHistory.push({ role: 'user', content: message });
            showTyping();

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: [
                            { role: 'system', content: 'Du bist ein hilfreicher, freundlicher AI-Assistent. Antworte immer auf Deutsch, sei präzise und informativ.' },
                            ...conversationHistory
                        ],
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                removeTyping();

                if (!response.ok) throw new Error(`API-Fehler: ${response.status}`);

                const data = await response.json();
                const reply = data.choices[0].message.content;
                addMessage(reply, 'assistant');
                conversationHistory.push({ role: 'assistant', content: reply });

            } catch (error) {
                removeTyping();
                addMessage(`❌ Fehler: ${error.message}`, 'assistant');
            }

            sendBtn.disabled = false;
            userInput.focus();
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        userInput.focus();
    </script>
</body>
</html>
